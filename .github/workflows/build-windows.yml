name: Build patched ScummVM for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      CONFIGURATION: Release
      PLATFORM: x64
      VCPKG_FEATURE_FLAGS: dependencygraph
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/source/vcpkg_installed
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/source/.github/vcpkg-ports
      GIT_VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4
        with:
          path: buildrepo

      - name: Checkout ScummVM
        uses: actions/checkout@v4
        with:
          repository: scummvm/scummvm
          ref: d187209bb0560cbdc8d6adea60cfa3c754a35544
          path: source

      - name: Apply TNG compatibility patches
        shell: pwsh
        run: |
          function Apply-RepositoryPatch([string] $PatchPath) {
            git -C buildrepo show "HEAD:$PatchPath" | git -C source apply -
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to apply $PatchPath"
            }
          }

          Apply-RepositoryPatch 'patches/0001-director-qtvr-preserve-command-result.patch'
          Apply-RepositoryPatch 'patches/0002-director-start-lingo-assigned-digital-video.patch'
          Apply-RepositoryPatch 'patches/0003-director-tng-transit-timing-and-cleanup.patch'
          Apply-RepositoryPatch 'patches/0003-testbed-headless-video-diagnostic.patch'
          Apply-RepositoryPatch 'patches/0004-director-tng-qtvr-hotspot-dispatch.patch'
          Apply-RepositoryPatch 'patches/0004-testbed-skip-headless-screen-updates.patch'
          Apply-RepositoryPatch 'patches/0005-testbed-direct-movie-diagnostic.patch'
          Apply-RepositoryPatch 'patches/0006-director-video-lifecycle-trace.patch'
          Apply-RepositoryPatch 'patches/0007-director-qtvr-dispose-arity.patch'
          Apply-RepositoryPatch 'patches/0008-director-trektech-video-layering-cleanup.patch'
          Apply-RepositoryPatch 'patches/0009-director-trektech-leading-text-marker.patch'
          Apply-RepositoryPatch 'patches/0010-director-trektech-single-hotspot-dispatch.patch'
          Apply-RepositoryPatch 'patches/0011-director-qtvr-object-redraw.patch'
          Apply-RepositoryPatch 'patches/0012-director-direct-to-stage-puppet-cleanup.patch'
          Apply-RepositoryPatch 'patches/0013-director-trektech-menu-and-drag-input.patch'
          Apply-RepositoryPatch 'patches/0014-director-trektech-blankqt-menu-overlay.patch'
          Apply-RepositoryPatch 'patches/0015-director-trektech-preserve-menu-trails.patch'
          Apply-RepositoryPatch 'patches/0016-director-trektech-preserve-stamped-menu.patch'
          Apply-RepositoryPatch 'patches/0017-director-trektech-wireframe-and-object-control.patch'
          Apply-RepositoryPatch 'patches/0018-director-qtvr-cancel-object-drag-on-exit.patch'
          Apply-RepositoryPatch 'patches/0019-director-trektech-object-drag-surface.patch'
          Apply-RepositoryPatch 'patches/0020-director-trektech-native-wireframe-size.patch'
          Apply-RepositoryPatch 'patches/0021-director-trektech-voice-only-shortcut.patch'
          Apply-RepositoryPatch 'patches/0022-director-trektech-voice-and-menu-input.patch'
          Apply-RepositoryPatch 'patches/0023-director-trektech-active-input.patch'
          Apply-RepositoryPatch 'patches/0024-director-apply-digital-video-sound.patch'
          Apply-RepositoryPatch 'patches/0025-director-trektech-gate-score-sound.patch'
          Apply-RepositoryPatch 'patches/0026-director-trektech-passive-hover-screens.patch'
          Apply-RepositoryPatch 'patches/0027-director-trektech-index-and-help-geometry.patch'
          Apply-RepositoryPatch 'patches/0030-director-trektech-index-height-and-help-clip.patch'
          Apply-RepositoryPatch 'patches/0032-director-trektech-plan-handoff-diagnostic.patch'
          Apply-RepositoryPatch 'patches/0033-director-qtvr-report-current-node.patch'
          Apply-RepositoryPatch 'patches/0034-director-trektech-help-plan-cleanup.patch'
          Apply-RepositoryPatch 'patches/0035-director-trektech-help-plan-owner-diagnostic.patch'
          Apply-RepositoryPatch 'patches/0036-director-trektech-help-plan-surface-diagnostic.patch'
          git -C source diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'Patched source failed git diff --check'
          }
          git -C source diff --stat

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgGitCommitId: ${{ env.GIT_VCPKG_COMMIT }}

      - name: Integrate vcpkg
        run: ${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}/vcpkg integrate install

      - name: Build project generator
        run: |
          cd source/devtools/create_project/cmake
          cmake .
          cmake --build . -j 2

      - name: Generate Director and video-test project
        run: |
          mkdir source/build-scummvm
          cd source/build-scummvm
          ../devtools/create_project/cmake/Debug/create_project.exe .. --msvc --vcpkg --disable-all-engines --enable-engine=director,testbed

      - uses: microsoft/setup-msbuild@v2

      - name: Install libraries
        working-directory: source
        run: vcpkg install

      - name: Build ScummVM
        run: |
          cd source/build-scummvm
          msbuild scummvm.sln /m /p:VcpkgEnableManifest=true /p:BuildInParallel=true /p:Configuration=${{ env.CONFIGURATION }} /p:PreferredToolArchitecture=x64 /p:Platform=${{ env.PLATFORM }} /v:minimal

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item source/build-scummvm/Releasex64/scummvm.exe package/
          Copy-Item source/vcpkg_installed/x64-windows/bin/*.dll package/ -ErrorAction SilentlyContinue
          Copy-Item source/gui/themes/*.zip package/
          Copy-Item source/dists/engine-data/*.dat package/ -ErrorAction SilentlyContinue

      - name: Upload patched ScummVM
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-tng-patched-windows-x64
          path: package
          if-no-files-found: error
